const $=s=>document.querySelector(s),g=$('#g'),c=g.getContext('2d'),TAU=6.2832,INK='#3b2a1a',FONT="'Patrick Hand',cursive";
let W,H,cam=0,fr=0,stage=0,sims=[],run=false,done=false,muted=false,A,osc,gn,conf=[],puf=[],bub={t:'',n:0},seed=7,win=-1,cars=[mkc('#e4352f',1,0)];
function mkc(col,sc,dy,name){return{x:0,tx:250,v:0,rot:0,col,sc,dy,name}}
function rs(){const d=devicePixelRatio||1;W=g.clientWidth;H=g.clientHeight;g.width=W*d;g.height=H*d;c.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);
const hy=x=>H*.76-(Math.sin(x*.005)*24+Math.sin(x*.0021+1)*38+Math.sin(x*.013)*5);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const NS=8,CC=['#e4352f','#2b6fdc'],GC=['#9b6bd6','#ffb347','#66c2a5','#ff8fb1'],f2=x=>x.toFixed(2);
/* Dataset Minggu 3 (identik dengan week3-dataset.js) */
const VMS=[{id:'VM-1',mips:1500,c:.04},{id:'VM-2',mips:2000,c:.06},{id:'VM-3',mips:2500,c:.08},{id:'VM-4',mips:3000,c:.10}],
TK=[4500,7200,3100,8900,5400,6200,2800,9100,4900,6700,3800,7500,5100,8200,4200,6900].map((m,i)=>({id:'T'+String(i+1).padStart(2,'0'),mi:m})),NV=4,
LB=TK.reduce((a,t)=>a+t.mi,0)/VMS.reduce((a,v)=>a+v.mips,0);
function ev(s){const ld=Array(NV).fill(0),bl=VMS.map(()=>[]);TK.forEach((t,i)=>{const j=s[i]%NV,a=ld[j],b=a+t.mi/VMS[j].mips;bl[j].push({id:t.id,a,b});ld[j]=b});
const mk=Math.max(...ld),av=ld.reduce((a,b)=>a+b,0)/NV;return{mk,cost:ld.reduce((a,l,j)=>a+l*VMS[j].c,0),di:(mk-Math.min(...ld))/av,ld,bl}}
class LCG{constructor(s=2026){this.s=s>>>0}random(){this.s=(this.s*1664525+1013904223)%4294967296;return this.s/4294967296}}
const E0={mk:Infinity,cost:Infinity,di:0,bl:[]};
/* ACO-SA: alpha=1, beta=1.5, rho=0.25, T=25*0.05^progress, 5 langkah SA per semut */
class ACO{constructor(P,T,r){this.name='ACO-SA';this.P=P;this.T=T;this.r=r;this.nfe=0;this.it=0;this.ph=TK.map(()=>Array(NV).fill(1));this.b=null;this.bm=E0;this.h=[]}
ant(){return TK.map((t,k)=>{const w=VMS.map((v,j)=>Math.pow(this.ph[k][j],1)*Math.pow(v.mips/t.mi,1.5)),sw=w.reduce((a,b)=>a+b,0);let x=this.r()*sw,c=NV-1;for(let j=0;j<NV;j++){x-=w[j];if(x<=0){c=j;break}}return c})}
sa(s0,T){this.nfe+=6;let c=[...s0],ce=ev(c);for(let k=0;k<5;k++){const n=[...c];n[Math.floor(this.r()*TK.length)]=Math.floor(this.r()*NV);const ne=ev(n),d=ne.mk-ce.mk;if(d<=0||this.r()<Math.exp(-d/Math.max(T,1e-4))){c=n;ce=ne}}return{s:c,e:ce}}
step(){if(this.it>=this.T)return;const tp=25*Math.pow(.05,this.it/Math.max(1,this.T-1));let bs=null,be={mk:Infinity};
for(let i=0;i<this.P;i++){const q=this.sa(this.ant(),tp);if(q.e.mk<be.mk){be=q.e;bs=q.s}}
for(let t=0;t<TK.length;t++){for(let v=0;v<NV;v++)this.ph[t][v]*=.75;this.ph[t][bs[t]]+=1/Math.max(be.mk,1e-6)}
if(be.mk<this.bm.mk){this.bm=be;this.b=[...bs]}this.it++;this.h.push(this.bm.mk)}}
/* DMFO-DE: F=0.6, CR=0.7, b=1. currentIter diinisialisasi 0 (di kode asli tidak, sehingga loop tidak pernah jalan) */
class DMFO{constructor(P,T,r){this.name='DMFO-DE';this.P=P;this.T=T;this.r=r;this.nfe=P;this.it=0;this.h=[];this.bm=E0;this.b=null;this.m=[];
for(let i=0;i<P;i++){const pos=TK.map(()=>Math.floor(r()*NV)),e=ev(pos);this.m.push({pos,f:e.mk,e});if(e.mk<this.bm.mk){this.bm=e;this.b=[...pos]}}}
cv(v){return((Math.round(v)%NV)+NV)%NV}
step(){if(this.it>=this.T)return;const r=this.r,fc=Math.max(1,Math.round(this.P-this.it*((this.P-1)/Math.max(1,this.T)))),fl=[...this.m].sort((a,b)=>a.f-b.f).slice(0,fc);
this.nfe+=this.P;for(let i=0;i<this.P;i++){const m=this.m[i],tf=fl[Math.min(i,fl.length-1)],tp=(r()-.5)*2,
sp=m.pos.map((v,d)=>this.cv(Math.abs(tf.pos[d]-v)*Math.exp(tp)*Math.cos(2*Math.PI*tp)+tf.pos[d])),a=this.m[Math.floor(r()*this.P)].pos,c=this.m[Math.floor(r()*this.P)].pos,jr=Math.floor(r()*TK.length),
tr=sp.map((v,d)=>(r()<.7||d===jr)?this.cv(this.b[d]+.6*(a[d]-c[d])):v),te=ev(tr);
if(te.mk<=m.f){m.pos=tr;m.f=te.mk;m.e=te;if(te.mk<this.bm.mk){this.bm=te;this.b=[...tr]}}}this.it++;this.h.push(this.bm.mk)}}
function mkPair(P,T,sd){const r1=new LCG(sd),r2=new LCG(sd);return[new ACO(P,T,()=>r1.random()),new DMFO(P,T,()=>r2.random())]}

"Mengurangi jumlah ngengat agar populasi tidak terlalu besar", "ok": false, "fb": "Tidak. Jumlah ngengat (populasi) tetap konstan. Hanya jumlah api referensi yang berkurang."}]}];

else{c.fillStyle=INK;c.font='20px '+FONT;c.fillText(txt,x+6,y-68)}}
function drawCar(o){const s=o.sc,r=14*s,xr=o.x-28*s,xf=o.x+28*s,yr=hy(xr)-r-o.dy,yf=hy(xf)-r-o.dy,an=Math.atan2(yf-yr,xf-xr),b=Math.abs(Math.sin(fr*.4))*o.v*.35,sx=o.x-cam;
c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(sx,hy(o.x)-o.dy+2,48*s,7*s,an,0,TAU);c.fill();
c.save();c.translate(sx,(yr+yf)/2-b);c.rotate(an);c.scale(s,s);c.lineWidth=3/s;c.strokeStyle=INK;c.lineJoin='round';
c.fillStyle=o.col;c.beginPath();c.roundRect(-44,-30,88,24,8);c.fill();c.stroke();
c.beginPath();c.moveTo(-26,-30);c.lineTo(-18,-50);c.lineTo(8,-50);c.lineTo(18,-30);c.closePath();c.fillStyle='#bfe9ff';c.fill();c.stroke();
c.fillStyle='#f4c59a';c.beginPath();c.arc(-3,-47,9,0,TAU);c.fill();c.stroke();c.fillStyle='#d02020';c.beginPath();c.arc(-3,-50,9,Math.PI,TAU);c.fill();c.stroke();c.fillRect(2,-52,12,4);c.strokeRect(2,-52,12,4);
c.fillStyle='#ffe066';c.beginPath();c.arc(42,-22,4,0,TAU);c.fill();c.stroke();
[-28,28].forEach(wx=>{c.save();c.translate(wx,0);c.fillStyle='#2a2a2a';c.beginPath();c.arc(0,0,14,0,TAU);c.fill();c.stroke();c.rotate(o.rot);c.fillStyle='#ddd';c.beginPath();c.arc(0,0,7,0,TAU);c.fill();c.stroke();c.beginPath();for(let i=0;i<3;i++){c.moveTo(0,0);c.lineTo(7*Math.cos(i*2.09),7*Math.sin(i*2.09))}c.stroke();c.restore()});
c.restore();
if(o.name){c.font='bold 18px '+FONT;c.fillStyle='#fff';c.strokeStyle=INK;c.lineWidth=4;c.strokeText(o.name,sx-18,(yr+yf)/2-72*s);c.fillText(o.name,sx-18,(yr+yf)/2-72*s)}
if(o.v>1&&fr%3==0)puf.push({x:xr,y:hy(xr)-8-o.dy,r:5,a:1})}
function bubble(){const L=cars.reduce((a,b)=>a.x>b.x?a:b),sx=L.x-cam,sy=hy(L.x)-L.dy-120;bub.n=Math.min(bub.t.length,bub.n+.7);const t=bub.t.slice(0,bub.n|0);c.font='21px '+FONT;
const ws=t.split(' '),ln=[];let cur='';ws.forEach(w=>{if(c.measureText(cur+' '+w).width>230&&cur){ln.push(cur);cur=w}else cur=cur?cur+' '+w:w});ln.push(cur);
const bw=Math.max(...ln.map(l=>c.measureText(l).width))+24,bh=ln.length*24+16,bx=Math.max(8,Math.min(W-bw-8,sx-bw/2)),by=sy-bh;

c.fillStyle=INK;ln.forEach((l,i)=>c.fillText(l,bx+12,by+27+i*24))}
function scene(){const q=c.createLinearGradient(0,0,0,H);q.addColorStop(0,'#7cc8f0');q.addColorStop(1,'#e8f7ff');c.fillStyle=q;c.fillRect(0,0,W,H);
c.fillStyle='#ffd23f';c.strokeStyle=INK;c.lineWidth=4;c.beginPath();c.arc(W*.86,H*.2,30,0,TAU);c.fill();c.stroke();
for(let i=0;i<8;i++){blob(((i*260-cam*.15)%2080+2080)%2080-120,H*.12+(i*37%40),1)}

const k0=Math.floor(cam*.5/150)-1;for(let k=k0;k<k0+W/150+3;k++){const x=k*150-cam*.5;c.lineWidth=2.5;tree(x,hf(.5,H*.68,28,x+cam*.5-cam*.5+0)+4,.7+(k*7%3)*.15)}

c.fillStyle='#8f5522';for(let k=Math.floor(cam/70);k<(cam+W)/70+1;k++){const x=k*70+(k*37%30)-cam;c.beginPath();c.arc(x,hy(cam+x)+22+(k*13%40),4+k%4,0,TAU);c.fill()}
c.beginPath();for(let x=-10;x<=W+10;x+=6)c[x<0?'moveTo':'lineTo'](x,hy(cam+x));c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=18;c.stroke();c.strokeStyle='#5fb83c';c.lineWidth=11;c.stroke();
for(let s=0;s<NS;s++){flag(s*1000+60,'S'+(s+1),0);flag(s*1000+950,'',1)}
puf=puf.filter(p=>(p.a-=.03)>0);puf.forEach(p=>{c.globalAlpha=p.a;c.fillStyle='#ddd';c.beginPath();c.arc(p.x-cam-(1-p.a)*20,p.y-(1-p.a)*20,p.r+(1-p.a)*8,0,TAU);c.fill()});c.globalAlpha=1;
[...cars].reverse().forEach(drawCar);
c.fillStyle='#4aa83a';c.strokeStyle=INK;c.lineWidth=3;for(let k=Math.floor(cam*1.3/90);k<(cam*1.3+W)/90+1;k++){const x=k*90-cam*1.3;c.beginPath();c.moveTo(x,H+2);c.quadraticCurveTo(x+8,H-16-(k*7%12),x+16,H+2);c.fill();c.stroke()}
bubble();conf=conf.filter(p=>p.y<H+20);conf.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;c.fillStyle=p.c;c.fillRect(p.x,p.y,8,p.r+3)})}
function frame(){fr++;if(run&&fr%5==0)tick();const b=stage*1000;
cars.forEach((o,i)=>{let p=prog;if(stage==3&&sim){p=sim.p[i];if(sim.done)p=i==sim.win?1:Math.min(p,.9)}o.tx=b+150+700*p});
cars.forEach(o=>{const dx=o.tx-o.x;o.v+=(Math.max(0,Math.min(7,dx*.04))-o.v)*.08;o.x+=o.v;o.rot+=o.v*.09});
const lead=Math.max(...cars.map(o=>o.x));cam+=(lead-W*.3-cam)*.06;
if(A){const sp=Math.max(...cars.map(o=>o.v));osc.frequency.setTargetAtTime(38+sp*16+Math.sin(fr*.5)*3,A.currentTime,.05);gn.gain.setTargetAtTime(muted?0:.03+sp*.012,A.currentTime,.1)}
scene();requestAnimationFrame(frame)}
rs();view(0);frame();
